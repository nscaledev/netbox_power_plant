[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
exclude = [".venv*", "tests*", "docs*", ".github*", ".gitignore"]

[tool.black]
line-length = 120
target_version = ['py312', 'py313', 'py314']

[project]
name = "netbox_power_plant"
dynamic = ["version"]
authors = [
    {name = "Mencken Davidson", email = "mencken@gmail.com"},
]
maintainers = [
    {name = "Mencken Davidson", email = "mencken@gmail.com"},
]
license = {file = "LICENSE"}
description = "NetBox plugin for facility-side power plant modeling and workflows."
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []
keywords = ["netbox", "plugin", "power", "facility", "electrical"]
requires-python = ">=3.12"

[project.urls]
Source = "https://github.com/menckend/netbox_power_plant"
Tracker = "https://github.com/menckend/netbox_power_plant/issues"

[project.optional-dependencies]
test = [
    "black==24.3.0",
    "flake8",
    "pre-commit==3.7.0",
]
